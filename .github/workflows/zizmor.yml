# Static security analysis of GitHub Actions workflows.
# advanced-security: false -> emits annotations and fails the job on findings,
# instead of SARIF upload (which needs GitHub Advanced Security on a private repo).
name: Workflow Security (zizmor)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo
      actions: read # zizmor online audits read workflow/action metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0 # pin the CLI; do not track "latest"
          advanced-security: false # no GHAS/SARIF upload
          annotations: true # inline annotations + fail CI (needs advanced-security: false)
          persona: regular
