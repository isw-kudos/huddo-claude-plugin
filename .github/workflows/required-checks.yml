# Aggregation gate: the branch ruleset requires this single context instead of
# the individual (paths-filtered) checks, which would deadlock PRs they skip.
# The shared action polls the Checks API; absent-after-grace = not applicable.
#
# pull_request_target runs the workflow from the BASE branch and the action is
# SHA-pinned, so a PR cannot neuter the gate. Never check out or run PR code here.
name: Required Checks

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] base-branch gate; no PR code executed
    branches:
      - main

concurrency:
  group: required-checks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read # the action polls the Checks API for the required contexts
    steps:
      - name: Wait for required checks
        uses: isw-kudos/github-actions/.github/actions/wait-for-required-checks@d956786c03927bdcb70641a3f3adb38b0600a7cd # wait-for-required-checks-v1.3.0
        with:
          # Every check listed here MUST run on draft PRs. `skipped` and
          # "absent after grace" both count as a pass, and ready_for_review
          # does not re-trigger this gate, so a draft-gated check would let a
          # PR merge with that check never having executed.
          required-checks: |
            Validate manifests
            Audit workflows
          grace-seconds: "150"
