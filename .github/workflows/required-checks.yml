# Aggregation gate: the branch ruleset requires this single context instead of
# the individual (paths-filtered) checks, which would deadlock PRs they skip.
# The vendored action polls the Checks API; absent-after-grace = not applicable.
#
# pull_request_target loads the workflow and action from the BASE branch so a
# PR cannot neuter the gate. Never check out or run PR code here.
name: Required Checks

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] base-branch gate; no PR code executed
    branches:
      - main

concurrency:
  group: required-checks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      # `$/` resolves the action at the running (base-branch) commit with no
      # checkout, so no runtime workspace state can substitute the gate.
      - name: Wait for required checks
        uses: $/.github/actions/wait-for-required-checks
        with:
          required-checks: |
            Validate manifests
            Audit workflows
          grace-seconds: "150"
